name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      # manim builds against pango and cairo
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config python3-dev libpango1.0-dev libcairo2-dev

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint - Ruff
        run: uv run ruff check

      - name: Format - Ruff
        run: uv run ruff format --check

      - name: Type check - mypy
        run: uv run mypy

      - name: Static analysis - Pylint
        run: uv run pylint grasp
