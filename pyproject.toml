[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-courses"
version = "0.1.0"
description = "Course materials in, animated lesson videos out."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13, <3.14"
dependencies = [
    "langchain-core>=1.1.0",
    "langchain-openai>=1.1.10",
    "av>=15.0.0",
    "manim>=0.20.1",
    "moviepy>=2.2.1",
    "numpy>=2.4.2",
    "pillow>=9.2.0,<12.0",
    "pydantic>=2.11.7",
    "qwen-tts>=0.1.0",
    "torch>=2.3.0",
    "python-dotenv>=1.2.2",
    "openai-whisper>=20250625",
]

[project.scripts]
grasp = "grasp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["grasp"]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "ruff>=0.15.4",
    "packaging>=26.0",
]

# Pyright
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingModuleSource = false
venvPath = "."
venv = ".venv"
# Exclude generated/cache artefacts
exclude = [
    ".cache",
    "courses",
    "output",
    ".venv",
    "**/__pycache__",
    "**/.*",
    "**/node_modules",
]





# Ruff
[tool.ruff.lint.per-file-ignores]
# Generated Manim scenes use `from manim import *` by convention
"courses/*/videos/*/scene.py" = ["F403", "F405"]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors (PEP 8 basics)
    "W",      # pycodestyle warnings
    "F",      # pyflakes (logical errors, unused imports)
    "I",      # isort (automatically sorts imports)
    "B",      # flake8-bugbear (flags common bugs and design problems)
    "UP",     # pyupgrade (automatically updates syntax to modern Python)
    "SIM",    # flake8-simplify (suggests code simplifications)
    "RUF",    # Ruff-specific rules
    "ANN",    # type annotations required
    "BLE",    # blind exception catches
    "TRY",    # exception handling best practices
    "N",      # PEP 8 naming conventions
    "PLR2004",# magic value literals
    "C90",    # McCabe cyclomatic complexity
    "TID",    # tidy imports (ban relative imports)
    "ISC",    # implicit string concatenation
]
ignore = [
    "ANN002",  # *args annotation - rarely adds value
    "ANN003",  # **kwargs annotation - rarely adds value
    "ANN401",  # use of Any - acceptable for complex types
    "TRY003",  # allow bare except clauses
    "ISC001",  # allow implicit string concatenation (e.g. multi-line docstrings)
]

[tool.ruff.lint.mccabe]
# One long imperative function beats five short ones calling each other.
max-complexity = 20

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
